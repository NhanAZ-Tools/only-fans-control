name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Restore pinned PawnIO components
        shell: powershell
        run: ./scripts/restore-dependencies.ps1
      - name: Build native Windows application
        shell: powershell
        run: ./build.ps1 -SkipPackage
      - name: Test simulated EC, profiles, single instance, and watchdog
        shell: powershell
        run: ./scripts/verify.ps1
      - name: Package application and source
        shell: powershell
        run: ./scripts/package.ps1
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes
      - name: Build Windows installer
        shell: powershell
        run: ./build-installer.ps1
      - name: Upload packages and installer
        uses: actions/upload-artifact@v7
        with:
          name: OnlyFansControl-windows-x64
          path: |
            OnlyFansControl-Windows-x64.zip
            OnlyFansControl-Source.zip
            SHA256SUMS.txt
            release/*-windows-setup.exe
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OnlyFansControl-test-results
          path: artifacts
          if-no-files-found: ignore
